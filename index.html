<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Red Line Fishing</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;font-family:Segoe UI,Arial,sans-serif}
body{background:#07111f;color:#fff;overflow:hidden}
#map{position:absolute;inset:0}
.top{position:absolute;z-index:1000;top:12px;left:12px;right:12px;display:flex;gap:10px;align-items:center}
.logo,.panel,.btn{background:rgba(7,17,31,.92);border:1px solid rgba(255,255,255,.12);box-shadow:0 8px 28px rgba(0,0,0,.3);backdrop-filter:blur(8px)}
.logo{padding:10px 14px;border-radius:14px;font-weight:900;font-size:17px;white-space:nowrap}.logo b{color:#ef4444}
.search{flex:1;max-width:560px}.search input{width:100%;padding:11px 16px;border:0;border-radius:999px;background:#132238;color:#fff;outline:0}
.controls{display:flex;gap:7px}.btn{border-radius:12px;color:#fff;padding:10px 12px;cursor:pointer}.btn.red{background:#dc2626;border-color:#dc2626}
.panel{position:absolute;z-index:1000;right:12px;top:78px;width:310px;border-radius:18px;padding:14px}
.panel h3{margin:0 0 12px;font-size:15px}.row{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid rgba(255,255,255,.08)}
.switch{width:44px;height:23px;border-radius:20px;background:#374151;cursor:pointer;position:relative}.switch.on{background:#dc2626}.switch:after{content:"";position:absolute;width:17px;height:17px;top:3px;left:3px;border-radius:50%;background:#fff;transition:.2s}.switch.on:after{left:24px}
.data{margin-top:12px;background:#0d1b2d;border-radius:12px;padding:10px;font-size:12px;line-height:1.7}
.legend{position:absolute;z-index:1000;left:12px;bottom:22px;background:rgba(7,17,31,.9);padding:10px 13px;border-radius:12px;font-size:11px}
.redline-popup .leaflet-popup-content-wrapper{padding:0;border-radius:16px;overflow:hidden}.redline-popup .leaflet-popup-content{margin:0;width:275px!important}.redline-popup .leaflet-popup-tip{background:#fff}
.card{color:#111827;background:#fff}.head{padding:13px 15px;background:linear-gradient(135deg,#dc2626,#991b1b);color:#fff}.head strong{font-size:15px}.head small{display:block;opacity:.85;margin-top:3px}.body{padding:12px 14px}.item{display:flex;gap:8px;padding:7px 0;border-bottom:1px solid #eef2f7;font-size:12px}.item span:last-child{margin-left:auto;font-weight:800}.safe,.danger{margin-top:9px;padding:8px;border-radius:10px;text-align:center;font-size:11px;font-weight:800}.safe{background:#dcfce7;color:#15803d}.danger{background:#fee2e2;color:#b91c1c}
@media(max-width:700px){.logo{display:none}.top{top:8px}.panel{left:8px;right:8px;width:auto;top:62px}.controls .btn{padding:9px}.search{max-width:none}}
</style>
</head>
<body>
<div id="map"></div>
<div class="top">
  <div class="logo">🐟 <b>RED</b> LINE FISHING</div>
  <div class="search"><input id="search" placeholder="🔍 Rechercher un lieu en Tunisie"></div>
  <div class="controls"><button class="btn red" id="wavesBtn">🌊</button><button class="btn" id="gpsBtn">📍</button><button class="btn" id="panelBtn">⚙️</button></div>
</div>

<div class="panel" id="panel">
<h3>🎣 Red Line Fishing</h3>
<div class="row"><span>🎣 Zones de pêche</span><div class="switch on" id="zonesSwitch"></div></div>
<div class="row"><span>🌊 Vagues</span><div class="switch" id="waveSwitch"></div></div>
<div class="row"><span>🗺️ Fond marin</span><div class="switch" id="oceanSwitch"></div></div>
<div class="data" id="weather">⏳ Chargement météo...</div>
</div>
<div class="legend">🟢 &lt; 0,5 m &nbsp; 🟡 0,5–1 m &nbsp; 🟠 1–1,5 m &nbsp; 🔴 &gt; 1,5 m</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
(function(){
"use strict";
const map=L.map("map",{zoomControl:false}).setView([36.8,11.5],7);
L.control.zoom({position:"bottomright"}).addTo(map);

const base=L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",{maxZoom:19,attribution:"© OpenStreetMap"}).addTo(map);
const ocean=L.tileLayer("https://server.arcgisonline.com/ArcGIS/rest/services/Ocean/World_Ocean_Base/MapServer/tile/{z}/{y}/{x}",{attribution:"Esri Ocean"});

const species=[
["Daurade Royale","الدنيس الملكي","Sep → Déc"],
["Loup de Mer","القاروص","Oct → Mar"],
["Sar Commune","السار","Mai → Sep"],
["Mérou","الهامور","Jun → Oct"]
];
const zonePts=[[37.10,10.40,"Nord"],[36.60,11.10,"Nord"],[36.20,11.60,"Centre"],[35.70,11.30,"Centre"],[35.10,11.40,"Centre"],[34.50,11.20,"Sud"]];
const zoneLayer=L.layerGroup().addTo(map);
const fishIcon=L.divIcon({className:"",html:"<div style='width:30px;height:30px;border-radius:50% 50% 50% 0;transform:rotate(-45deg);background:#dc2626;border:2px solid white;display:flex;align-items:center;justify-content:center'><span style='transform:rotate(45deg)'>🐟</span></div>",iconSize:[30,30],iconAnchor:[15,30]});

zonePts.forEach(p=>{
 const m=L.marker([p[0],p[1]],{icon:fishIcon}).addTo(zoneLayer);
 let rows=species.map(s=>"<div class='item'><span>🐟 "+s[0]+"</span><span>"+s[2]+"</span></div>").join("");
 m.bindPopup("<div class='card'><div class='head'><strong>🎣 Zone "+p[2]+"</strong><small>Red Line Fishing</small></div><div class='body'>"+rows+"<div class='safe'>🎣 Zone recommandée</div></div></div>",{className:"redline-popup",maxWidth:300});
});

let waveLayer=null;
const wavePts=[[37.3,9.9],[37,10.5],[36.7,11],[36.4,11.4],[36,11.5],[35.6,11.3],[35.2,11.2],[34.7,11.1],[34.1,11],[33.5,11]];
function color(h){return h<.5?"#22c55e":h<1?"#eab308":h<1.5?"#f97316":"#dc2626"}
async function loadWaves(){
 if(waveLayer){map.removeLayer(waveLayer);waveLayer=null;return}
 waveLayer=L.layerGroup().addTo(map);
 await Promise.all(wavePts.map(async p=>{
   try{
    const u="https://marine-api.open-meteo.com/v1/marine?latitude="+p[0]+"&longitude="+p[1]+"&current=wave_height,wave_direction,wave_period&timezone=auto";
    const r=await fetch(u); if(!r.ok)throw new Error("HTTP "+r.status);
    const d=await r.json(),c=d.current||{},h=Number(c.wave_height);
    if(!Number.isFinite(h))return;
    const mk=L.circleMarker(p,{radius:17,color:color(h),fillColor:color(h),fillOpacity:.55,weight:2}).addTo(waveLayer);
    const status=h<.5?"Mer calme":h<1?"Modérée":h<1.5?"Agitée":"Forte";
    mk.bindPopup("<div class='card'><div class='head'><strong>🌊 État de la mer</strong><small>Red Line Fishing</small></div><div class='body'>"+
      "<div class='item'><span>🌊 Hauteur</span><span>"+h.toFixed(2)+" m</span></div>"+
      "<div class='item'><span>🧭 Direction</span><span>"+(c.wave_direction!=null?Math.round(c.wave_direction)+"°":"--")+"</span></div>"+
      "<div class='item'><span>⏱️ Période</span><span>"+(c.wave_period!=null?Number(c.wave_period).toFixed(1)+" s":"--")+"</span></div>"+
      "<div class='"+(h<1.5?"safe":"danger")+"'>"+(h<1.5?"🎣 Conditions acceptables":"⚠️ Prudence en mer")+"</div></div></div>",{className:"redline-popup",maxWidth:300});
   }catch(e){console.log("Wave:",e)}
 }));
}

async function weather(lat=36.8,lon=11.5){
 try{
  const u="https://api.open-meteo.com/v1/forecast?latitude="+lat+"&longitude="+lon+"&current=temperature_2m,wind_speed_10m,wind_direction_10m,wind_gusts_10m&timezone=auto";
  const d=await (await fetch(u)).json(),c=d.current;
  const nd=(Number(c.wind_speed_10m)/1.852).toFixed(1),g=(Number(c.wind_gusts_10m)/1.852).toFixed(1);
  document.getElementById("weather").innerHTML="🌡️ <b>"+c.temperature_2m+"°C</b><br>🌬️ Vent : <b>"+nd+" nd</b><br>💨 Rafales : <b>"+g+" nd</b><br>🧭 Direction : <b>"+Math.round(c.wind_direction_10m)+"°</b>";
 }catch(e){document.getElementById("weather").textContent="⚠️ Météo indisponible"}
}
weather();

document.getElementById("panelBtn").onclick=()=>document.getElementById("panel").style.display=document.getElementById("panel").style.display==="none"?"block":"none";
document.getElementById("wavesBtn").onclick=async()=>{document.getElementById("waveSwitch").classList.toggle("on");await loadWaves()};
document.getElementById("waveSwitch").onclick=async()=>{document.getElementById("waveSwitch").classList.toggle("on");await loadWaves()};
document.getElementById("zonesSwitch").onclick=()=>{document.getElementById("zonesSwitch").classList.toggle("on");zoneLayer.getLayers().forEach(m=>map.hasLayer(m)?map.removeLayer(m):map.addLayer(m))};
document.getElementById("oceanSwitch").onclick=()=>{document.getElementById("oceanSwitch").classList.toggle("on");map.hasLayer(ocean)?map.removeLayer(ocean):map.addLayer(ocean)};
document.getElementById("gpsBtn").onclick=()=>{
 if(!navigator.geolocation){alert("GPS non disponible");return}
 navigator.geolocation.getCurrentPosition(pos=>{const la=pos.coords.latitude,lo=pos.coords.longitude;map.setView([la,lo],13);L.marker([la,lo]).addTo(map).bindPopup("📍 Vous êtes ici").openPopup();weather(la,lo)},()=>alert("Impossible de déterminer votre position"));
};

let timer;
document.getElementById("search").addEventListener("input",function(){
 clearTimeout(timer);const q=this.value.trim();if(q.length<3)return;
 timer=setTimeout(async()=>{
  try{
   const r=await fetch("https://nominatim.openstreetmap.org/search?format=json&limit=1&accept-language=fr&q="+encodeURIComponent(q+" Tunisia"));
   const d=await r.json();if(d[0]){const la=+d[0].lat,lo=+d[0].lon;map.setView([la,lo],12);L.marker([la,lo]).addTo(map).bindPopup("📍 "+d[0].display_name).openPopup();weather(la,lo)}
  }catch(e){console.log(e)}
 },500);
});
})();
</script>
</body>
</html>
