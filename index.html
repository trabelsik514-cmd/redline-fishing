<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Red Line Fishing</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
<style>
body{font-family:Tahoma,sans-serif}
.glass{background:rgba(10,20,40,.88);backdrop-filter:blur(8px);border:1px solid rgba(255,255,255,.1)}
.fish-pin{background:#dc2626;width:30px;height:30px;border-radius:50% 50% 50% 0;transform:rotate(-45deg);display:flex;align-items:center;justify-content:center;border:2px solid #fff}
.fish-pin span{transform:rotate(45deg)}
</style>
</head>
<body class="bg-slate-950 text-white h-screen flex flex-col">

<!-- شاشة الدخول -->
<div id="authScreen" class="fixed inset-0 z-[9999] bg-slate-950 flex items-center justify-center p-4">
  <div class="glass rounded-3xl w-full max-w-sm p-6 text-center">
    <p class="text-6xl mb-2">🎣</p>
    <h2 class="font-black text-2xl italic mb-4"><span class="text-red-600">RED</span> LINE</h2>
    <input id="authEmail" type="email" placeholder="📧 البريد / E-mail" class="w-full bg-slate-800 rounded-full px-4 py-2.5 text-sm text-center mb-3 outline-none">
    <input id="authPass" type="password" placeholder="🔒 كلمة السر / Mot de passe" class="w-full bg-slate-800 rounded-full px-4 py-2.5 text-sm text-center mb-3 outline-none">
    <p id="authError" class="text-red-500 text-xs hidden mb-2"></p>
    <div class="flex gap-2">
      <button onclick="authEnter()" class="flex-1 bg-red-600 rounded-full py-2.5 text-sm font-bold">🚪 دخول</button>
      <button onclick="authRegister()" class="flex-1 border border-red-600 rounded-full py-2.5 text-sm font-bold">✍️ اشتراك</button>
    </div>
    <button onclick="resetPass()" class="text-[11px] text-gray-400 underline mt-3">🔑 نسيت كلمة السر؟</button>
  </div>
</div>

<!-- الهيدر -->
<header class="glass flex items-center gap-2 px-3 py-2 z-20">
  <span class="text-2xl">🐟</span>
  <h1 class="font-black italic hidden sm:block"><span class="text-red-600">RED</span> LINE</h1>
  <input id="searchInput" oninput="searchPlace(this.value)" placeholder="🔍 Rechercher..." class="flex-1 bg-slate-800 rounded-full px-4 py-2 text-sm outline-none">
  <button onclick="myLocation()" class="bg-blue-600 rounded-full w-9 h-9 font-bold">📍</button>
  <button onclick="toggleLang()" class="bg-red-600 rounded-full px-2.5 py-1.5 text-xs font-bold" id="langBtn">🌐 FR</button>
  <button onclick="logoutUser()" class="hidden text-lg" id="logoutBtn">🚪</button>
</header>
<div class="relative flex-1">
  <div id="searchResults" class="absolute top-1 left-3 right-3 glass rounded-xl hidden max-h-60 overflow-y-auto z-[2000]"></div>
  <div id="map" class="w-full h-full"></div>

  <!-- لوحة الطقس -->
  <div class="absolute top-3 right-3 glass rounded-2xl p-3 z-[1000] w-64 text-sm">
    <div id="liveData"><p class="text-gray-400 text-xs">⏳ ...</p></div>
    <div id="sunBox" class="mt-2 text-xs border-t border-white/10 pt-2 hidden"></div>
  </div>

  <!-- توقعات 7 أيام -->
  <div class="absolute bottom-3 left-3 right-3 md:right-auto md:w-[430px] glass rounded-2xl p-3 z-[1000]">
    <p class="font-bold text-sm mb-2" id="fcTitle">📅 Prévisions 7 jours</p>
    <div id="forecastContent" class="grid grid-cols-7 gap-1 text-center text-xs"></div>
  </div>
</div>

<!-- الأنواع والمفضلة -->
<nav class="glass flex justify-around py-2 text-xs z-20">
  <button onclick="openSpecies()" class="px-2">🐠<br>Espèces</button>
  <button onclick="openFavs()" class="px-2">⭐<br>Favoris</button>
</nav>

<div id="speciesModal" class="fixed inset-0 bg-black/70 z-[3000] hidden items-center justify-center p-3">
  <div class="glass rounded-2xl w-full max-w-[600px] max-h-[85vh] overflow-y-auto p-4">
    <div class="flex justify-between mb-3"><p class="font-bold text-lg">🐠 Espèces marines</p><button onclick="closeModal('speciesModal')" class="text-xl">✕</button></div>
    <div id="speciesList" class="grid grid-cols-1 sm:grid-cols-2 gap-2"></div>
  </div>
</div>
<div id="favModal" class="fixed inset-0 bg-black/70 z-[3000] hidden items-center justify-center p-3">
  <div class="glass rounded-2xl w-full max-w-sm p-4">
    <div class="flex justify-between mb-3"><p class="font-bold text-lg">⭐ Mes Favoris</p><button onclick="closeModal('favModal')" class="text-xl">✕</button></div>
    <div id="favList" class="space-y-2 text-sm"></div>
  </div>
</div>

<script>
firebase.initializeApp({apiKey:"AIzaSyCKLRKGwp5XBtEmwjMdrmDWg7-9S29ixgA",authDomain:"red-line-fishing.firebaseapp.com",projectId:"red-line-fishing",storageBucket:"red-line-fishing.firebasestorage.app",messagingSenderId:"1029157660725",appId:"1:1029157660725:web:2e1d308de2163f887ca97c"});
var auth=firebase.auth(),db=firebase.firestore();
var lang='fr',currentLat=36.8,currentLon=11.5,currentUser=null,favs=[];

/* ===== المصادقة ===== */
function showMsg(t){var e=document.getElementById('authError');e.textContent=t;e.classList.remove('hidden')}
function authRegister(){auth.createUserWithEmailAndPassword(Email(),Pass()).catch(function(e){showMsg(e.message)})}
function authEnter(){auth.signInWithEmailAndPassword(Email(),Pass()).catch(function(e){showMsg(e.message)})}
function resetPass(){auth.sendPasswordResetEmail(Email()).then(function(){showMsg('📧 رابط الاستعادة أُرسل')}).catch(function(e){showMsg(e.message)})}
function Email(){return document.getElementById('authEmail').value.trim()}
function Pass(){return document.getElementById('authPass').value}
function logoutUser(){auth.signOut()}
auth.onAuthStateChanged(function(u){
  currentUser=u;
  document.getElementById('authScreen').style.display=u?'none':'flex';
  document.getElementById('logoutBtn').classList.toggle('hidden',!u);
  if(u){loadFavs();if(window.map)map.invalidateSize()}
});

/* ===== الخريطة ===== */
var map=L.map('map').setView([36.8,11.5],7);
L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',{attribution:'Esri'}).addTo(map);
var fishIcon=L.divIcon({className:'',html:'<div class="fish-pin"><span>🐟</span></div>',iconSize:[30,30]});
[[37.1,10.4],[36.2,11.6],[35.1,11.4],[34.5,11.2]].forEach(function(p){L.marker(p,{icon:fishIcon}).addTo(map).bindPopup('🎣 منطقة صيد')});

/* ===== الأنواع ===== */
var species=[
{fr:"Daurade Royale",ar:"الدنيس",icon:"🐟",season:"Sep→Déc",size:"35cm",desc:"قرب الصخور"},
{fr:"Loup de Mer",ar:"القاروص",icon:"🐠",season:"Oct→Mar",size:"30cm",desc:"الخلجان"},
{fr:"Sar",ar:"السار",icon:"🐟",season:"Mai→Sep",size:"25cm",desc:"فوق الرمال"},
{fr:"Mérou",ar:"الهامور",icon:"🐡",season:"Jun→Oct",size:"45cm",desc:"الكهوف"},
{fr:"Mulet",ar:"البوري",icon:"🐟",season:"Aoû→Nov",size:"30cm",desc:"أسراب"},
{fr:"Calamar",ar:"الكلمار",icon:"🦑",season:"Oct→Fév",size:"20cm",desc:"ليلاً"}];
function renderSpecies(){var h='';
species.forEach(function(s){h+='<div class="glass rounded-xl p-3 text-sm"><span class="text-3xl">'+s.icon+'</span> <b>'+(lang==='ar'?s.ar:s.fr)+'</b><p class="text-xs text-blue-300">📅 '+s.season+'</p><p class="text-xs text-yellow-300">📏 '+s.size+'</p><p class="text-xs text-gray-300">'+s.desc+'</p></div>'});
document.getElementById('speciesList').innerHTML=h}
function openSpecies(){renderSpecies();var m=document.getElementById('speciesModal');m.classList.remove('hidden');m.classList.add('flex')}
function closeModal(id){var m=document.getElementById(id);m.classList.add('hidden');m.classList.remove('flex')}

/* ===== الطقس + التوقعات ===== */
function wIcon(c){return c===0?'☀️':c<=3?'⛅':c<=67?'🌧️':'⛈️'}
function fetchWeather(){
fetch('https://api.open-meteo.com/v1/forecast?latitude='+currentLat+'&longitude='+currentLon+'&current=temperature_2m,wind_speed_10m&daily=wave_height_max,temperature_2m_max,temperature_2m_min,weather_code,wind_speed_10m_max&timezone=auto')
.then(function(r){return r.json()}).then(function(d){
  var nd=(d.current.wind_speed_10m/1.852).toFixed(1);
  document.getElementById('liveData').innerHTML='<p>🌡️ '+d.current.temperature_2m+'°C • 🌬️ '+nd+' nd • 🌊 '+(d.daily.wave_height_max[0]||'--')+' m</p>';
  var days=['Dim','Lun','Mar','Mer','Jeu','Ven','Sam'],h='';
  for(var i=0;i<7;i++){var day=new Date(d.daily.time[i]);
  h+='<div class="glass rounded-lg p-1"><p class="text-gray-400">'+days[day.getDay()]+'</p><p class="text-base">'+wIcon(d.daily.weather_code[i])+'</p><p class="font-bold">'+d.daily.temperature_2m_max[i]+'°</p><p class="text-cyan-300 text-[10px]">🌊'+(d.daily.wave_height_max[i]||'--')+'m</p></div>'}
  document.getElementById('forecastContent').innerHTML=h;
})}
fetchWeather();

/* ===== GPS + شروق/غروب ===== */
function myLocation(){
  navigator.geolocation.getCurrentPosition(function(pos){
    var la=pos.coords.latitude,lo=pos.coords.longitude;
    currentLat=la;currentLon=lo;
    map.setView([la,lo],13);
    L.marker([la,lo]).addTo(map).bindPopup('📍 أنت هنا').openOn(map);
    fetchWeather();
    fetch('https://api.open-meteo.com/v1/forecast?latitude='+la+'&longitude='+lo+'&daily=sunrise,sunset&current=wind_speed_10m&timezone=auto')
    .then(function(r){return r.json()}).then(function(d){
      var sr=d.daily.sunrise[0].split('T')[1],ss=d.daily.sunset[0].split('T')[1];
      var nd=(d.current.wind_speed_10m/1.852).toFixed(1);
      var box=document.getElementById('sunBox');
      box.classList.remove('hidden');
      box.innerHTML='<p>🌅 '+sr+' — 🌇 '+ss+'</p><p>'+(nd<15?'✅ الرياح آمنة':'⚠️ رياح قوية!')+'</p>';
    });
  },function(){alert('⚠️ فعّل GPS')},{enableHighAccuracy:true,timeout:10000});
}

/* ===== المفضلة ===== */
function loadFavs(){if(!currentUser)return;
db.collection('favs').doc(currentUser.uid).collection('places').get().then(function(q){favs=[];q.forEach(function(d){favs.push(d.data())});renderFavs()})}
function addFav(lat,lon,name){if(!currentUser){alert('سجّل دخولك أولاً');return}
db.collection('favs').doc(currentUser.uid).collection('places').doc(encodeURIComponent(name)).set({lat:lat,lon:lon,name:name}).then(loadFavs)}
function delFav(name){db.collection('favs').doc(currentUser.uid).collection('places').doc(encodeURIComponent(name)).delete().then(loadFavs)}
function renderFavs(){var box=document.getElementById('favList');
if(!favs.length){box.innerHTML='<p class="text-gray-400 text-xs">لا مفضلة بعد</p>';return}
var h='';
favs.forEach(function(f){var n=f.name.replace(/'/g,"");
h+='<div class="flex justify-between glass rounded-xl p-2"><span onclick="goTo('+f.lat+','+f.lon+',\''+n+'\')" class="cursor-pointer">📍 '+f.name+'</span><button onclick="delFav(\''+n+'\')" class="text-red-500">🗑️</button></div>'});
box.innerHTML=h}
function openFavs(){renderFavs();var m=document.getElementById('favModal');m.classList.remove('hidden');m.classList.add('flex')}

/* ===== البحث ===== */
var sT;
function searchPlace(q){clearTimeout(sT);
var box=document.getElementById('searchResults');
if(q.length<3){box.classList.add('hidden');return}
sT=setTimeout(function(){
fetch('https://nominatim.openstreetmap.org/search?format=json&q='+encodeURIComponent(q+' Tunisia')+'&limit=6')
.then(function(r){return r.json()}).then(function(res){
var h='';
res.forEach(function(r){var name=r.display_name.replace(/'/g,"");
h+='<div onclick="goTo('+r.lat+','+r.lon+',\''+name+'\')" class="px-3 py-2 cursor-pointer text-sm border-b border-white/5">📍 '+r.display_name+'</div>'});
box.innerHTML=h;box.classList.remove('hidden')})},400)}
function goTo(lat,lon,name){
map.setView([lat,lon],11);
L.popup().setLatLng([lat,lon]).setContent('<b>'+name+'</b><br><button onclick="addFav('+lat+','+lon+',\''+name+'\')" class="mt-1 bg-red-600 rounded-full px-3 py-1 text-xs">⭐ مفضلة</button>').openOn(map);
currentLat=lat;currentLon=lon;fetchWeather();
document.getElementById('searchResults').classList.add('hidden')}

/* ===== اللغة ===== */
function toggleLang(){lang=lang==='fr'?'ar':'fr';
document.getElementById('langBtn').textContent=lang==='fr'?'🌐 FR':'🌐 AR';
document.getElementById('fcTitle').textContent=lang==='fr'?'📅 Prévisions 7 jours':'📅 توقعات 7 أيام'}
</script>
</body>
</html>
